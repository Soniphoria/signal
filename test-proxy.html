<!DOCTYPE html>
<html>
<body>
<script>
fetch('/azure-proxy/dcbc4662-4d1d-4f25-9e05-5d45dc16e7b9/63d4b260-b991-4e83-bb71-0b44bcd63e42/midi/electric_guitar1_midi.mid')
  .then(r => {
    console.log('Status:', r.status);
    console.log('Content-Type:', r.headers.get('content-type'));
    return r.arrayBuffer();
  })
  .then(buf => {
    console.log('Size:', buf.byteLength);
    const view = new DataView(buf);
    if (buf.byteLength >= 4) {
      const header = String.fromCharCode(
        view.getUint8(0), view.getUint8(1),
        view.getUint8(2), view.getUint8(3)
      );
      console.log('Header:', header);
    }
    // Print first 100 bytes as text
    const text = new TextDecoder().decode(buf.slice(0, 100));
    console.log('First 100 bytes:', text);
  });
</script>
</body>
</html>
